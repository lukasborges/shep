name: Build

# Runs the suite and proves the app packages from the repository rather than from somebody's laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Electron binary is ~120 MB and the same for every run on a version.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      # .npmrc disables the lockfile, so this resolves versions fresh every run.
      # package.json pins them exactly, which is the only thing holding it steady.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The suite launches the real app, which needs a display: scripts/headless.sh gives it xvfb.
      # xdotool sends the real clicks the title bar test needs. Ubuntu keeps unprivileged user
      # namespaces from Chromium's sandbox unless told otherwise.
      - name: Prepare the display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: npm test

      - name: Package
        run: npm run build && npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tesselium-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Windows has a desktop of its own, so there is no display to prepare: the suite's windows
      # open on it. The one test that sends the display server's own clicks skips itself, xdotool
      # being X11's alone.
      - name: Test
        run: npm test

      # Nothing here is signed. electron-builder skips the signing step when no certificate is
      # configured, and what comes out warns of an unknown publisher on the machine that runs it.
      - name: Package
        run: npm run build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tesselium-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A Mac runner has a desktop of its own, as Windows does, and the title bar test skips itself there too.
      - name: Test
        run: npm test

      # Signed ad hoc only, which an Apple silicon Mac needs to run it at all: without a Developer ID it is
      # neither signed nor notarised, and Gatekeeper asks before it first opens.
      - name: Package
        run: npm run build && npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tesselium-mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
