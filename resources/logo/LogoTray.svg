<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    The tray icon on Linux: the three hexagons in white, filling the square,
    because the panels it sits in -- GNOME's top bar above all -- draw their
    own icons monochrome and light, and a coloured mark there is the one thing
    that is not. Windows keeps the full-colour icon, which is what its
    notification area expects. A Mac's menu bar takes this one too, as a
    template: it reads only the shape and paints it in its own colour.

    Drawn on the 16px grid rather than scaled from Logo.svg, whose gaps would
    close at this size: here they are 1.36px wide.
  -->
  <g fill="#ffffff">
    <polygon points="4.2,1.11 7.318,2.91 7.318,6.51 4.2,8.31 1.082,6.51 1.082,2.91"/>
    <polygon points="11.8,1.11 14.918,2.91 14.918,6.51 11.8,8.31 8.682,6.51 8.682,2.91"/>
    <polygon points="8,7.69 11.118,9.49 11.118,13.09 8,14.89 4.882,13.09 4.882,9.49"/>
  </g>
</svg>
