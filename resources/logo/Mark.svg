<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Logo.svg for the lock screen, which paints the rail's colour: navy in the
    light theme and near-black in the dark one, where the deep blue hexagon
    would sink into it. The three wear a white outline around the whole
    silhouette, the way a sticker does.
  -->
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6caff"/><stop offset="1" stop-color="#6b9ff2"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f93ff"/><stop offset="1" stop-color="#1d5ad6"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e8481f"/></linearGradient>
  </defs>
  <g transform="translate(64 64) scale(0.92) translate(-64 -62)">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round">
      <polygon points="35.5,10.25 58.883,23.75 58.883,50.75 35.5,64.25 12.117,50.75 12.117,23.75"/>
      <polygon points="92.5,10.25 115.883,23.75 115.883,50.75 92.5,64.25 69.117,50.75 69.117,23.75"/>
      <polygon points="64,59.75 87.383,73.25 87.383,100.25 64,113.75 40.617,100.25 40.617,73.25"/>
    </g>
    <g stroke-width="7.5" stroke-linejoin="round">
      <polygon fill="url(#light)" stroke="url(#light)" points="35.5,10.25 58.883,23.75 58.883,50.75 35.5,64.25 12.117,50.75 12.117,23.75"/>
      <polygon fill="url(#deep)" stroke="url(#deep)" points="92.5,10.25 115.883,23.75 115.883,50.75 92.5,64.25 69.117,50.75 69.117,23.75"/>
      <polygon fill="url(#coral)" stroke="url(#coral)" points="64,59.75 87.383,73.25 87.383,100.25 64,113.75 40.617,100.25 40.617,73.25"/>
    </g>
  </g>
</svg>
