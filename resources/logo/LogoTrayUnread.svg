<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    The tray icon on Linux while something is unread: the white hexagons with
    a red dot on their top right corner and a gap cut around the dot, so the
    two do not merge at 16px. The dot is Adwaita red 3, the badge colour the
    app uses everywhere else.
  -->
  <defs>
    <mask id="notch" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#ffffff"/>
      <circle cx="13" cy="3" r="3.9" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#notch)" fill="#ffffff">
    <polygon points="4.2,1.11 7.318,2.91 7.318,6.51 4.2,8.31 1.082,6.51 1.082,2.91"/>
    <polygon points="11.8,1.11 14.918,2.91 14.918,6.51 11.8,8.31 8.682,6.51 8.682,2.91"/>
    <polygon points="8,7.69 11.118,9.49 11.118,13.09 8,14.89 4.882,13.09 4.882,9.49"/>
  </g>
  <circle cx="13" cy="3" r="2.7" fill="#e01b24"/>
</svg>
