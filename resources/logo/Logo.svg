<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Tessely: the application icon, the same on every system.

    Three hexagons tiling into one shape, a tessera each, which is where the
    name comes from: every service is a tile and the window is the mosaic.
    The two above are blues, light and deep; the one below is coral, the
    colour of something waiting.

    There is no plate behind them. Windows draws an app's icon as its own
    shape, and the same silhouette is kept for the dock, the GNOME grid and
    the lock screen, so the mark is one drawing everywhere. It fills the
    square from edge to edge, as the apps beside it on a taskbar do.

    Each hexagon is stroked in its own gradient with round joins, which is
    what rounds its corners; the gap left between them is 2.7 units, enough
    to still show three tiles at 32px.
  -->
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6caff"/><stop offset="1" stop-color="#6b9ff2"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f93ff"/><stop offset="1" stop-color="#1d5ad6"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e8481f"/></linearGradient>
  </defs>
  <g stroke-width="7.5" stroke-linejoin="round">
    <polygon fill="url(#light)" stroke="url(#light)" points="35.5,10.25 58.883,23.75 58.883,50.75 35.5,64.25 12.117,50.75 12.117,23.75"/>
    <polygon fill="url(#deep)" stroke="url(#deep)" points="92.5,10.25 115.883,23.75 115.883,50.75 92.5,64.25 69.117,50.75 69.117,23.75"/>
    <polygon fill="url(#coral)" stroke="url(#coral)" points="64,59.75 87.383,73.25 87.383,100.25 64,113.75 40.617,100.25 40.617,73.25"/>
  </g>
</svg>
